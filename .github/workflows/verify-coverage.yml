name: verify-coverage

# 診斷用：還原快取的 twstock.db，印出 inst(主力/外資/投信)、shareholding(400大戶)、
# stockmeta(發行張數) 的實際涵蓋範圍（不抓網路、不部署，約 1 分鐘）。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore price DB
        uses: actions/cache/restore@v6
        with:
          path: twstock.db
          key: twstockdb-coverage
          restore-keys: twstockdb-
      - name: Report coverage
        run: |
          python - <<'PY'
          import sqlite3, os
          if not os.path.exists("twstock.db"):
              print("NO DB restored"); raise SystemExit(0)
          c = sqlite3.connect("twstock.db")
          def q(sql, *a):
              try: return c.execute(sql, a).fetchone()
              except Exception as e: return ("ERR", str(e))
          print("== inst (total_lots 非空) ==", q("SELECT COUNT(*),MIN(date),MAX(date) FROM inst WHERE total_lots IS NOT NULL"))
          print("== inst 全部列 ==", q("SELECT COUNT(*),MIN(date),MAX(date) FROM inst"))
          for sid in ("2330", "6491", "2317", "2454"):
              tot = q("SELECT COUNT(*),MIN(date),MAX(date) FROM inst WHERE total_lots IS NOT NULL AND stock_id=?", sid)
              print(f"   {sid} total_lots:", tot)
              # 檢查是否連續：列出該股 total_lots 日期的『年份分佈』
              yrs = {}
              for (d,) in c.execute("SELECT date FROM inst WHERE total_lots IS NOT NULL AND stock_id=? ORDER BY date", (sid,)):
                  yrs[d[:4]] = yrs.get(d[:4], 0) + 1
              print(f"       年份分佈: {yrs}")
          print("== shareholding(400大戶) ==", q("SELECT COUNT(*),MIN(date),MAX(date) FROM shareholding"))
          print("   2330:", q("SELECT COUNT(*),MIN(date),MAX(date) FROM shareholding WHERE stock_id='2330'"))
          try:
              n = c.execute("SELECT COUNT(*) FROM stockmeta").fetchone()[0]
              samp = c.execute("SELECT stock_id,issued_lots FROM stockmeta WHERE stock_id IN ('2330','6491','2317')").fetchall()
              print("== stockmeta(發行張數) 檔數:", n, "樣本:", samp)
          except Exception as e:
              print("== stockmeta ERR:", e)
          print("== price 參考 2330 ==", q("SELECT COUNT(*),MIN(date),MAX(date) FROM price WHERE stock_id='2330'"))
          PY
