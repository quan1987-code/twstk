name: daily-screener

on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore price DB
        uses: actions/cache/restore@v6
        with:
          path: twstock.db
          key: twstockdb-${{ github.run_id }}
          restore-keys: twstockdb-
      - name: Run screener
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python tw_volume_breakout_screener_v2.py
      - name: Build site
        run: python build_site.py
      - name: Build 處置股專區
        run: python tw_disposition.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: Build 產業資金流向（熱圖＋120日資金輪動）
        run: python tw_industry_flow.py
      - name: Build 市場分析（台美股每日盤勢 market.html）
        run: python tw_market_analysis.py
      - name: Save price DB
        if: always()
        uses: actions/cache/save@v6
        with:
          path: twstock.db
          key: twstockdb-${{ github.run_id }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # Pages 後端偶發「Deployment failed, try again later.」，失敗時退避重試最多 3 次
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: 部署失敗，等 90 秒重試
        if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: 仍失敗，等 5 分鐘做最後一次重試
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 300
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
