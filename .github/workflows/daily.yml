name: daily-screener

on:
  schedule:
    # cron 皆為 UTC；台北固定 UTC+8（台灣無日光節約），美股有夏令/冬令之分。
    # 依「兩地收盤後資料實際到位的時間」分兩段自動更新（非收盤瞬間就抓）：
    #
    # ① 台股盤後 — 台股 13:30 收盤，三大法人(T86)約 15:00–16:00 公布、FinMind 傍晚到位。
    #    10:00 UTC = 台北 18:00（週一～五），抓當日台股收盤價＋三大法人買賣超，
    #    更新爆量起漲／投信連買／處置股／資金流向／台股族群等台股區塊。
    - cron: '0 10 * * 1-5'
    #
    # ② 美股盤後 — 美股 16:00 ET 收盤 = 20:00 UTC(夏令)／21:00 UTC(冬令)，
    #    yfinance／Stooq 日線約收盤後 1–3 小時穩定到位。
    #    23:30 UTC = 台北次日 07:30（夏令距美股收盤 3.5h、冬令 2.5h，皆足夠日線落地），
    #    趕在台股 09:00 開盤前更新 market.html 的美股四大指數／費半／類股／VIX／ADR 溢價等盤勢面板。
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      deep_backfill:
        description: '深度回補 主力/大戶 歷史至 2019（高上限、單次長跑；平時排程用低上限逐步補）'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore price DB
        uses: actions/cache/restore@v6
        with:
          path: twstock.db
          key: twstockdb-${{ github.run_id }}
          restore-keys: twstockdb-
      - name: Run screener
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          # 平時排程：留空 → 程式用預設低上限(150日/12週)，每日 run 快、逐步補歷史。
          # 手動 deep_backfill：拉高上限做一次性長跑，盡量一次補到 2019（timeout 350 分內）。
          INST_BACKFILL_PER_RUN: ${{ inputs.deep_backfill && '4000' || '' }}
          SHAREHOLD_MAX_PER_RUN: ${{ inputs.deep_backfill && '500' || '' }}
        run: python tw_volume_breakout_screener_v2.py
      - name: Build site
        run: python build_site.py
      - name: Build 處置股專區
        run: python tw_disposition.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: Build 產業資金流向（熱圖＋120日資金輪動）
        run: python tw_industry_flow.py
      - name: Build 輝哥選股（均線突破四海遊龍／盤整突破）
        run: python tw_hui_picks.py
      - name: Build 市場分析（台美股每日盤勢 market.html）
        run: python tw_market_analysis.py
      - name: Save price DB
        if: always()
        uses: actions/cache/save@v6
        with:
          path: twstock.db
          key: twstockdb-${{ github.run_id }}
      - uses: actions/configure-pages@v6
      # artifact 名帶 run_attempt：同一 run 手動 Re-run 時不會出現兩份同名
      # github-pages artifact（deploy-pages 遇到重名會直接失敗）
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      # Pages 後端偶發「Deployment failed, try again later.」，失敗時退避重試最多 3 次
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
        continue-on-error: true
      - name: 部署失敗，等 90 秒重試
        if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
        continue-on-error: true
      - name: 仍失敗，等 5 分鐘做最後一次重試
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 300
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
