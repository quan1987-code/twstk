name: verify-shareholding

# 診斷用：只驗證 FinMind TaiwanStockHoldingSharesPer 的抓取方式與級距格式，
# 不涉及 github-pages、不部署，可用 workflow_dispatch 快速執行（約 1 分鐘）。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe + all-market week fetch + big400 check
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import tw_volume_breakout_screener_v2 as S
          tok = os.environ.get("FINMIND_TOKEN", "")
          print("token present:", bool(tok))
          # 1) 逐檔探測（data_id=2330）取得可用週日期
          probe = S.finmind_get("TaiwanStockHoldingSharesPer", tok, max_retry=3,
                                data_id="2330", start_date="2026-03-01")
          print("probe empty:", probe.empty, "| rows:", 0 if probe.empty else len(probe))
          if probe.empty:
              print("PROBE FAILED — 無法取得日期清單"); raise SystemExit(0)
          dates = sorted(str(x) for x in probe["date"].unique())
          print("probe weeks:", len(dates), "latest 3:", dates[-3:])
          print("probe columns:", list(probe.columns))
          print("probe level sample:", sorted(probe["HoldingSharesLevel"].astype(str).unique()))
          d = dates[-1]
          # 2) 全市場單週（start_date=end_date=d，無 data_id）— 這是每日流程用的方式
          try:
              wk = S.finmind_get("TaiwanStockHoldingSharesPer", tok, max_retry=2,
                                 start_date=d, end_date=d)
              print(f"ALL-MARKET week {d}: empty={wk.empty} rows={0 if wk.empty else len(wk)}")
              if not wk.empty:
                  print("  stocks:", wk["stock_id"].nunique())
                  big = wk[wk["HoldingSharesLevel"].map(S._is_big400_level)]
                  print("  big400 rows:", len(big))
                  g = big[big["stock_id"].astype(str) == "2330"]
                  import pandas as pd
                  v = pd.to_numeric(g["percent"], errors="coerce").sum() if len(g) else float("nan")
                  print(f"  2330 big400 %% (>=400 lots): {round(float(v),2)}")
          except Exception as e:
              print(f"ALL-MARKET FAILED（改用逐檔）：{e}")
              # 3) 後備：逐檔（data_id）計算 2330 big400，確認至少逐檔可用
              g = probe[probe["date"].astype(str) == d]
              big = g[g["HoldingSharesLevel"].map(S._is_big400_level)]
              import pandas as pd
              v = pd.to_numeric(big["percent"], errors="coerce").sum() if len(big) else float("nan")
              print(f"  [per-stock fallback] 2330 {d} big400 %%: {round(float(v),2)} (big rows={len(big)})")
          PY
