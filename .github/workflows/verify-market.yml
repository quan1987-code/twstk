name: verify-market-sources

# 診斷用：驗證 tw_market_analysis 的美股/總經抓取（Stooq 主・yfinance 備援）。
# 不涉及 github-pages 環境、不部署，可在功能分支上以 workflow_dispatch 執行。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch US/macro via Stooq(+yfinance fallback) and report coverage
        run: |
          python - <<'PY'
          import tw_market_analysis as M
          syms = M.all_us_symbols()
          data = M.fetch_us(syms, "20240101")
          got = sorted(data)
          missing = [s for s in syms if s not in data]
          print("=== COVERAGE ===")
          print(f"requested={len(syms)} got={len(got)} missing={len(missing)}")
          print("MISSING:", missing)
          # 逐檔印最新收盤，肉眼檢查數值合理性（指數/殖利率/匯率/期貨）
          for s in ("^GSPC","^IXIC","^DJI","^SOX","^RUT","^N225","^KS11","^TWII",
                    "^VIX","^TNX","DX-Y.NYB","TWD=X","CL=F","GC=F","BTC-USD","SMH","TSM","2330.TW"):
              d = data.get(s)
              if d:
                  print(f"  {s:10s} {d['dates'][-1]}  close={d['closes'][-1]:.2f}  n={len(d['closes'])}")
              else:
                  print(f"  {s:10s} <MISSING>")
          # 走一次 us_build 確認不炸
          us = M.us_build(data)
          print("us_build ok:", bool(us), "| indices:", len(us.get("indices",[])) if us else 0,
                "| sectors:", len(us.get("sectors",[])) if us else 0)
          PY
